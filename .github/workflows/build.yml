name: Build QingPin IME

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -B build64 -G "Visual Studio 17 2022" -A x64

      - name: Build x64
        run: cmake --build build64 --config Release

      - name: Run engine tests (24 checks)
        run: ./build64/Release/qingpin-test.exe dict/dict.txt "$env:RUNNER_TEMP/userdict.txt"

      - name: Configure Win32
        run: cmake -B build32 -G "Visual Studio 17 2022" -A Win32

      - name: Build Win32
        run: cmake --build build32 --config Release

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/QingPinIME"
          New-Item -ItemType Directory -Force "$dist/bin", "$dist/installer" | Out-Null
          Copy-Item build64/Release/QingPinIME.dll        "$dist/bin/"
          Copy-Item build32/Release/QingPinIME.dll        "$dist/bin/QingPinIME_x86.dll"
          Copy-Item build64/Release/qingpin-dicttool.exe  "$dist/bin/"
          Copy-Item build64/Release/qingpin-test.exe      "$dist/bin/"
          Copy-Item -Recurse -Force dict                  "$dist/dict"
          Copy-Item -Recurse -Force assets                "$dist/assets"
          Copy-Item installer/install.bat, installer/uninstall.bat "$dist/installer/"
          Copy-Item README.md                             "$dist/"
          Compress-Archive -Path dist/QingPinIME -DestinationPath QingPinIME-bin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: QingPinIME-bin
          path: QingPinIME-bin.zip
          retention-days: 30
