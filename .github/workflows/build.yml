name: Build QingPin IME

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Visual Studio version
        shell: pwsh
        run: |
          $v = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property catalog_productLineVersion
          if (-not $v) { $v = "17" }
          if ([int]($v.ToString().Split('.')[0]) -ge 18) { $gen = "Visual Studio 18 2026" } else { $gen = "Visual Studio 17 2022" }
          "VS_GEN=$gen" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "VS $v -> generator: $gen"

      - name: Configure x64
        run: cmake -B build64 -G "$env:VS_GEN" -A x64

      - name: Build x64
        run: cmake --build build64 --config Release

      - name: Run engine tests (24 checks)
        run: ./build64/Release/qingpin-test.exe dict/dict.txt "$env:RUNNER_TEMP/userdict.txt"

      - name: Configure Win32
        run: cmake -B build32 -G "$env:VS_GEN" -A Win32

      - name: Build Win32
        run: cmake --build build32 --config Release

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/QingPinIME"
          New-Item -ItemType Directory -Force "$dist/bin", "$dist/installer" | Out-Null
          Copy-Item build64/Release/QingPinIME.dll        "$dist/bin/"
          Copy-Item build32/Release/QingPinIME.dll        "$dist/bin/QingPinIME_x86.dll"
          Copy-Item build64/Release/qingpin-dicttool.exe  "$dist/bin/"
          Copy-Item build64/Release/qingpin-test.exe      "$dist/bin/"
          Copy-Item -Recurse -Force dict                  "$dist/dict"
          Copy-Item -Recurse -Force assets                "$dist/assets"
          Copy-Item installer/install.bat, installer/uninstall.bat "$dist/installer/"
          Copy-Item README.md                             "$dist/"
          Compress-Archive -Path dist/QingPinIME -DestinationPath QingPinIME-bin.zip

      - name: Publish Release (permanent download link)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0-latest --yes --cleanup-tag 2>$null
          gh release create v1.0-latest QingPinIME-bin.zip --title "QingPin IME v1.0 (32/64-bit DLL)" --notes "Extract, then right-click installer\install.bat and Run as administrator."

      - uses: actions/upload-artifact@v4
        with:
          name: QingPinIME-bin
          path: QingPinIME-bin.zip
          retention-days: 30
